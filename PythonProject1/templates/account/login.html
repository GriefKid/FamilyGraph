{% extends 'base_auth.html' %}
{% block content %}
    <p>Not a member? <a href="{% url 'register' %}">Register now</a></p>
    <h1>Hello Again!</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="sign-in-btn">Sign In</button>
    </form>
{% endblock %}
