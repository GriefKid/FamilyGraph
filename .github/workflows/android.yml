name: Build FamilyGraph Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'HTTPS URL of the deployed FamilyGraph server'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install JavaScript dependencies
        run: npm install
      - name: Configure server URL
        run: npm run configure
        env:
          FAMILYGRAPH_SERVER_URL: ${{ inputs.server_url }}
      - name: Create and sync Android project
        run: npx cap add android && npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: familygraph-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
