{% extends "base.html" %}
{% load static %}

{% block content %}

<div id="graph-wrapper">
	<div id="graph-container">

		<div id="graph-toolbar" class="glass-panel">
			<input id="searchNode" type="text" placeholder="جستجوی نود...">
			<input id="pathA" type="text" placeholder="نود الف">
			<input id="pathB" type="text" placeholder="نود ب">
			<button id="findPathBtn">یافتن مسیر</button>
		</div>

		<div id="graph-stats" class="glass-panel"></div>

		<div id="graph-legend" class="glass-panel">
			<div id="graph-legend-title">نوع رابطه</div>
		</div>

		<canvas id="graphCanvas"></canvas>

	</div>
</div>

<style>

/* remove content padding for graph page */
.content{ padding:0 !important; animation:none !important; }

#graph-wrapper{
  width:100%;
  height:calc(100vh - 52px);
  padding:16px;
  box-sizing:border-box;
}

#graph-container{
  position:relative;
  width:100%; height:100%;
  background:linear-gradient(145deg,#04040e 0%,#060618 60%,#050510 100%);
  border-radius:14px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.06);
  box-shadow:0 0 60px rgba(0,0,0,.8), 0 0 120px rgba(99,102,241,.04), inset 0 1px 0 rgba(255,255,255,.04);
}

#graphCanvas{
  width:100%; height:100%;
  display:block;
  cursor:grab;
}
#graphCanvas:active{ cursor:grabbing; }

/* ─── GLASS PANEL BASE ─── */
.glass-panel{
  position:absolute;
  z-index:20;
  background:rgba(8,8,24,.75);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  box-shadow:0 4px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
}

/* ─── TOOLBAR ─── */
#graph-toolbar{
  top:14px; left:14px;
  display:flex; gap:6px;
  padding:10px 12px;
}

#graph-toolbar input{
  padding:7px 12px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:8px;
  background:rgba(255,255,255,.05);
  color:#e8eaf6;
  font-size:12.5px;
  font-family:'Vazirmatn',sans-serif;
  outline:none;
  transition:.18s ease;
  width:140px;
}
#graph-toolbar input::placeholder{ color:#484870; }
#graph-toolbar input:focus{
  border-color:rgba(99,102,241,.4);
  background:rgba(99,102,241,.08);
  box-shadow:0 0 0 3px rgba(99,102,241,.10) !important;
}

#graph-toolbar button{
  padding:7px 14px;
  border:none;
  border-radius:8px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:#fff;
  font-family:'Vazirmatn',sans-serif;
  font-size:12px; font-weight:600;
  cursor:pointer;
  transition:.18s ease;
  box-shadow:0 0 14px rgba(99,102,241,.35);
}
#graph-toolbar button:hover{ opacity:.88; transform:translateY(-1px); }

/* ─── STATS ─── */
#graph-stats{
  top:14px; right:14px;
  padding:12px 16px;
  font-size:12px;
  color:#8888aa;
  line-height:1.9;
  min-width:130px;
}
#graph-stats strong{ color:#a5b4fc; }

/* ─── LEGEND ─── */
#graph-legend{
  bottom:16px; right:14px;
  padding:12px 16px;
  min-width:130px;
}
#graph-legend-title{
  font-size:10px; font-weight:700;
  color:#484870; letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:8px;
}

</style>

<script>

const canvas = document.getElementById("graphCanvas")
const ctx = canvas.getContext("2d")

let W,H

function resize(){
	W = canvas.parentElement.clientWidth
	H = canvas.parentElement.clientHeight
	canvas.width = W
	canvas.height = H
}
resize()
window.addEventListener("resize",resize)



/* ---------------- DATA ---------------- */

let nodes=[]
let edges=[]
let nodeMap={}
let adjacency={}
let images={}

let highlightedEdges=new Set()

const PALETTE=[
  "#6366f1","#ec4899","#f59e0b","#10b981","#3b82f6",
  "#ef4444","#8b5cf6","#06b6d4","#f97316","#14b8a6",
  "#84cc16","#a855f7","#e11d48","#0ea5e9","#d97706"
]

let relColors={}



/* ---------------- VIEW ---------------- */

let offsetX=0
let offsetY=0
let scale=1



/* ---------------- DRAG VIEW ---------------- */

let dragging=false
let dragMoved=false
let lastX=0
let lastY=0

canvas.addEventListener("mousedown",e=>{
	dragging=true
	dragMoved=false
	lastX=e.clientX
	lastY=e.clientY
})

canvas.addEventListener("mouseup",e=>{
	if(!dragMoved){
		/* click — find node under cursor */
		let cx=(e.offsetX-offsetX)/scale
		let cy=(e.offsetY-offsetY)/scale
		for(let n of nodes){
			let r=images[n.id]&&images[n.id].complete ? 20 : 10
			let dx=cx-n.x, dy=cy-n.y
			if(dx*dx+dy*dy<=r*r){
				window.location.href="/nodes/"+n.id+"/"
				break
			}
		}
	}
	dragging=false
	dragMoved=false
})

canvas.addEventListener("mouseleave",()=>{ dragging=false; dragMoved=false })

canvas.addEventListener("mousemove",e=>{

	/* hover cursor */
	if(!dragging){
		let cx=(e.offsetX-offsetX)/scale
		let cy=(e.offsetY-offsetY)/scale
		let onNode=nodes.some(n=>{
			let r=images[n.id]&&images[n.id].complete?20:10
			return (cx-n.x)**2+(cy-n.y)**2<=r*r
		})
		canvas.style.cursor=onNode?"pointer":"grab"
	}

	if(!dragging) return

	let dx=e.clientX-lastX
	let dy=e.clientY-lastY
	if(Math.abs(dx)+Math.abs(dy)>4) dragMoved=true

	offsetX += dx
	offsetY += dy

	lastX = e.clientX
	lastY = e.clientY

})



/* ---------------- ZOOM ---------------- */

canvas.addEventListener("wheel",e=>{
	e.preventDefault()
	let zoom = e.deltaY < 0 ? 1.1 : 0.9
	scale *= zoom
})



/* ---------------- LOAD GRAPH ---------------- */

function loadGraph(){

	fetch("/api/graph/all/")
	.then(r=>r.json())
	.then(data=>{

		nodes=data.nodes
		edges=data.edges

		nodeMap={}
		adjacency={}
		images={}

		nodes.forEach(n=>{

			let id=parseInt(n.id)

			nodeMap[id]=n
			adjacency[id]=[]

			if(n.image){
				let img=new Image()
				img.src=n.image
				images[n.id]=img
			}

		})

		edges.forEach(e=>{

			let s=parseInt(e.source)
			let t=parseInt(e.target)

			if(adjacency[s]) adjacency[s].push(t)
			if(adjacency[t]) adjacency[t].push(s)

		})

		randomLayout()

		let root=nodes.find(n=>n.username.toLowerCase()==="root")||nodes[0]
		centerRoot(root.id)

		buildRelColors()
		buildLegend()
		updateStats()

	})

}



/* ---------------- INITIAL LAYOUT ---------------- */

function randomLayout(){

	nodes.forEach(n=>{

		n.x = Math.random()*W
		n.y = Math.random()*H

		n.vx=0
		n.vy=0

	})

}



/* ---------------- PHYSICS ENGINE ---------------- */

function physicsStep(){

	let repulsion = 2500
	let spring = 0.02
	let damping = 0.85
	let gravity = 0.005

	let centerX = W/2
	let centerY = H/2


	/* node repulsion */

	for(let i=0;i<nodes.length;i++){

		for(let j=i+1;j<nodes.length;j++){

			let a = nodes[i]
			let b = nodes[j]

			let dx = a.x - b.x
			let dy = a.y - b.y

			let dist = Math.sqrt(dx*dx + dy*dy) + 0.1

			let force = repulsion / (dist*dist)

			let fx = force * dx / dist
			let fy = force * dy / dist

			a.vx += fx
			a.vy += fy

			b.vx -= fx
			b.vy -= fy
		}
	}


	/* edge springs */

	edges.forEach(e=>{

		let s=nodeMap[parseInt(e.source)]
		let t=nodeMap[parseInt(e.target)]

		if(!s || !t) return

		let dx=t.x-s.x
		let dy=t.y-s.y

		let dist=Math.sqrt(dx*dx+dy*dy)+0.1

		let force=(dist-120)*spring

		let fx=force*dx/dist
		let fy=force*dy/dist

		s.vx+=fx
		s.vy+=fy

		t.vx-=fx
		t.vy-=fy

	})


	/* gravity to center */

	nodes.forEach(n=>{

		let dx = centerX - n.x
		let dy = centerY - n.y

		n.vx += dx * gravity
		n.vy += dy * gravity

	})


	/* apply velocity */

	nodes.forEach(n=>{

		n.vx *= damping
		n.vy *= damping

		n.x += n.vx
		n.y += n.vy


		/* boundary limit */

		let margin = 80

		if(n.x < -margin) n.x = -margin
		if(n.x > W + margin) n.x = W + margin

		if(n.y < -margin) n.y = -margin
		if(n.y > H + margin) n.y = H + margin

	})

}




/* ---------------- CENTER ---------------- */

function centerRoot(id){

	let root=nodeMap[id]
	if(!root) return

	offsetX = canvas.width/2 - root.x
	offsetY = canvas.height/3 - root.y

}



/* ---------------- STATS ---------------- */

function updateStats(){

	let s=document.getElementById("graph-stats")

	let n=nodes.length
	let e=edges.length
	let d=(2*e)/(n*(n-1)||1)

	s.innerHTML=
	"<strong>نودها</strong> "+n+"<br>"+
	"<strong>یال‌ها</strong> "+e+"<br>"+
	"<strong>تراکم</strong> "+d.toFixed(3)

}



/* ---------------- REL COLORS ---------------- */

function buildRelColors(){
	let types=[...new Set(edges.map(e=>e.label||"سایر"))].sort()
	types.forEach((r,i)=>{ relColors[r]=PALETTE[i%PALETTE.length] })
}

function buildLegend(){
	let el=document.getElementById("graph-legend")
	/* keep the title div, clear rest */
	let title=document.getElementById("graph-legend-title")
	el.innerHTML=""
	el.appendChild(title)
	Object.entries(relColors).forEach(([label,color])=>{
		let item=document.createElement("div")
		item.style.cssText="display:flex;align-items:center;gap:7px;margin-bottom:6px;"
		item.innerHTML=`<span style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0;box-shadow:0 0 6px ${color}88"></span><span style="font-size:11.5px;color:#8888aa;font-family:'Vazirmatn',sans-serif">${label||"سایر"}</span>`
		el.appendChild(item)
	})
}


/* ---------------- DRAW EDGES ---------------- */

function drawEdges(){
	edges.forEach(e=>{
		let s=nodeMap[parseInt(e.source)]
		let t=nodeMap[parseInt(e.target)]
		if(!s||!t) return

		let key=parseInt(e.source)+"-"+parseInt(e.target)
		let label=e.label||"سایر"
		let baseColor=relColors[label]||"#6aa9ff"

		if(highlightedEdges.has(key)){
			ctx.strokeStyle="#ffd54f"
			ctx.lineWidth=3.5
			ctx.shadowColor="#ffd54f"
			ctx.shadowBlur=8
		}else{
			ctx.strokeStyle=baseColor+"99"  /* 60% opacity */
			ctx.lineWidth=1.5
			ctx.shadowBlur=0
		}

		ctx.beginPath()
		ctx.moveTo(s.x,s.y)
		ctx.lineTo(t.x,t.y)
		ctx.stroke()
		ctx.shadowBlur=0
	})
}



/* ---------------- DRAW NODES ---------------- */

function drawNodes(){
	nodes.forEach(n=>{
		let img=images[n.id]
		let r=img&&img.complete ? 20 : 11

		/* glow ring */
		ctx.beginPath()
		ctx.arc(n.x,n.y,r+3,0,Math.PI*2)
		ctx.strokeStyle="rgba(99,102,241,0.35)"
		ctx.lineWidth=1.5
		ctx.shadowColor="rgba(99,102,241,0.5)"
		ctx.shadowBlur=8
		ctx.stroke()
		ctx.shadowBlur=0

		if(img&&img.complete){
			ctx.save()
			ctx.beginPath()
			ctx.arc(n.x,n.y,20,0,Math.PI*2)
			ctx.clip()
			ctx.drawImage(img,n.x-20,n.y-20,40,40)
			ctx.restore()
		}else{
			/* filled circle */
			let grad=ctx.createRadialGradient(n.x-3,n.y-3,1,n.x,n.y,r)
			grad.addColorStop(0,"#8b94fb")
			grad.addColorStop(1,"#4f52c4")
			ctx.beginPath()
			ctx.fillStyle=grad
			ctx.arc(n.x,n.y,r,0,Math.PI*2)
			ctx.fill()
		}

		/* label */
		ctx.fillStyle="rgba(232,234,246,0.9)"
		ctx.font="600 11px 'Vazirmatn',sans-serif"
		ctx.textAlign="center"
		ctx.shadowColor="rgba(0,0,0,0.8)"
		ctx.shadowBlur=4
		ctx.fillText(n.username,n.x,n.y-r-6)
		ctx.shadowBlur=0
	})
}



/* ---------------- MAIN DRAW ---------------- */

function draw(){

	ctx.clearRect(0,0,W,H)

	physicsStep()

	ctx.save()

	ctx.translate(offsetX,offsetY)
	ctx.scale(scale,scale)

	drawEdges()
	drawNodes()

	ctx.restore()

	requestAnimationFrame(draw)

}



/* ---------------- SEARCH ---------------- */

function searchNode(name){

	let node=nodes.find(n=>n.username.toLowerCase().trim()===name.toLowerCase().trim())

	if(!node){
		alert("Node not found")
		return
	}

	offsetX=W/2-node.x
	offsetY=H/2-node.y

}



/* ---------------- SHORTEST PATH ---------------- */

function findPath(a,b){

	let startNode=null
	let endNode=null

	nodes.forEach(n=>{
		if(n.username.toLowerCase().trim()===a.toLowerCase().trim()) startNode=n
		if(n.username.toLowerCase().trim()===b.toLowerCase().trim()) endNode=n
	})

	if(!startNode||!endNode){
		alert("Node not found")
		return
	}

	let start=parseInt(startNode.id)
	let end=parseInt(endNode.id)

	let queue=[start]
	let visited=new Set([start])
	let parent={}

	while(queue.length){

		let current=queue.shift()

		if(current===end) break

		for(let n of adjacency[current]||[]){

			if(!visited.has(n)){
				visited.add(n)
				parent[n]=current
				queue.push(n)
			}

		}

	}

	if(!visited.has(end)){
		alert("No path found")
		return
	}

	let path=[end]
	let cur=end

	while(parent[cur]!=undefined){
		cur=parent[cur]
		path.unshift(cur)
	}

	highlightPath(path)

}



function highlightPath(path){

	highlightedEdges.clear()

	for(let i=0;i<path.length-1;i++){

		let a=path[i]
		let b=path[i+1]

		highlightedEdges.add(a+"-"+b)
		highlightedEdges.add(b+"-"+a)

	}

}



/* ---------------- EVENTS ---------------- */

document.getElementById("searchNode").addEventListener("keydown",e=>{
	if(e.key==="Enter") searchNode(e.target.value)
})

document.getElementById("findPathBtn").onclick=()=>{

	let a=document.getElementById("pathA").value
	let b=document.getElementById("pathB").value

	findPath(a,b)

}



/* ---------------- START ---------------- */

loadGraph()
draw()

</script>

{% endblock %}
