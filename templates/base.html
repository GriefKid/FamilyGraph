<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}FamilyGraph{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>

*{ box-sizing:border-box; margin:0; padding:0; }

/* ─── DESIGN TOKENS ─── */
:root{
  --bg:#04040e;
  --surface:rgba(255,255,255,.028);
  --card:rgba(255,255,255,.04);
  --card-solid:#0c0c1e;

  --border:rgba(255,255,255,.075);
  --border-soft:rgba(255,255,255,.04);
  --border-accent:rgba(99,102,241,.28);

  --text:#e8eaf6;
  --text-muted:#484870;
  --text-soft:#7878a0;

  --primary:#6366f1;
  --primary-light:#a5b4fc;
  --primary-glow:rgba(99,102,241,.14);
  --primary-border:rgba(99,102,241,.30);
  --secondary:#8b5cf6;
  --danger:#f43f5e;

  --sidebar-w:232px;
  --radius:10px;
  --transition:.18s ease;
}

.light{
  --bg:#f0f0fa;
  --surface:rgba(255,255,255,.65);
  --card:rgba(255,255,255,.78);
  --card-solid:#ffffff;
  --border:rgba(99,102,241,.12);
  --border-soft:rgba(99,102,241,.07);
  --border-accent:rgba(99,102,241,.25);
  --text:#12122a;
  --text-muted:#9090b8;
  --text-soft:#5a5a8a;
  --primary:#4f46e5;
  --primary-light:#6366f1;
  --primary-glow:rgba(79,70,229,.10);
  --primary-border:rgba(79,70,229,.25);
}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar{ width:4px; height:4px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:rgba(99,102,241,.25); border-radius:10px; }
::-webkit-scrollbar-thumb:hover{ background:rgba(99,102,241,.45); }

/* ─── BODY ─── */
body{
  font-family:'Vazirmatn',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  font-size:14px;
  line-height:1.6;
  transition:background var(--transition), color var(--transition);
  position:relative;
  overflow-x:hidden;
}

/* Ambient glow orbs */
.ambient{
  position:fixed; pointer-events:none; z-index:0;
  border-radius:50%; filter:blur(80px); opacity:.55;
  transition:opacity .5s;
}
.ambient-1{
  width:640px; height:640px; top:-180px; right:-120px;
  background:radial-gradient(circle, rgba(99,102,241,.20) 0%, transparent 65%);
}
.ambient-2{
  width:500px; height:500px; bottom:-160px; left:-80px;
  background:radial-gradient(circle, rgba(139,92,246,.14) 0%, transparent 60%);
}
.ambient-3{
  width:340px; height:340px; top:45%; left:38%;
  background:radial-gradient(circle, rgba(59,130,246,.07) 0%, transparent 60%);
}
.light .ambient{ opacity:.15; }

/* ─── SIDEBAR ─── */
.sidebar{
  width:var(--sidebar-w);
  min-height:100vh;
  background:rgba(6,6,20,.82);
  backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  border-left:1px solid var(--border);
  display:flex;
  flex-direction:column;
  position:fixed;
  right:0; top:0;
  z-index:100;
}
.light .sidebar{ background:rgba(240,240,252,.88); }

/* shimmer accent top */
.sidebar::after{
  content:'';
  position:absolute;
  top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg,transparent,rgba(99,102,241,.45),transparent);
  pointer-events:none;
}

.logo{
  padding:20px 18px 15px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}

.logo-icon{
  width:36px; height:36px;
  border-radius:11px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  margin-bottom:11px;
  box-shadow:0 0 24px rgba(99,102,241,.55), 0 4px 14px rgba(0,0,0,.45);
}

.logo-name{
  font-size:15px; font-weight:700; letter-spacing:-.3px;
  background:linear-gradient(135deg, var(--text) 30%, var(--primary-light));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.light .logo-name{
  background:linear-gradient(135deg,#12122a 30%,#4f46e5);
  -webkit-background-clip:text; background-clip:text;
}

.logo-desc{ font-size:11px; color:var(--text-muted); margin-top:2px; }

/* ─── NAV ─── */
.nav{ padding:10px 8px; flex:1; overflow-y:auto; }

.nav-section, .nav-label{
  font-size:10px; font-weight:700;
  color:var(--text-muted);
  letter-spacing:1.1px; text-transform:uppercase;
  padding:12px 10px 5px;
}

.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 12px;
  border-radius:var(--radius);
  text-decoration:none;
  color:var(--text-soft);
  font-size:13px; font-weight:500;
  transition:all var(--transition);
  margin-bottom:1px;
  position:relative;
}
.nav-item:hover{ background:rgba(99,102,241,.10); color:var(--text); }
.nav-item.active{
  background:rgba(99,102,241,.16);
  color:var(--primary-light);
  border-left:2px solid var(--primary);
}
.light .nav-item.active{ color:var(--primary); }

.nav-icon{
  font-size:15px; width:22px;
  text-align:center; flex-shrink:0;
  opacity:.75; transition:opacity var(--transition);
}
.nav-item.active .nav-icon, .nav-item:hover .nav-icon{ opacity:1; }

/* ─── SIDEBAR BOTTOM ─── */
.sidebar-bottom{
  padding:12px 8px;
  border-top:1px solid var(--border);
  flex-shrink:0;
}

.theme-btn{
  display:flex; align-items:center; gap:9px;
  width:100%; padding:9px 12px;
  border-radius:var(--radius);
  border:none; background:none;
  color:var(--text-soft);
  font-family:'Vazirmatn',sans-serif;
  font-size:13px; cursor:pointer;
  transition:var(--transition);
}
.theme-btn:hover{ background:rgba(99,102,241,.10); color:var(--text); }

/* ─── MAIN ─── */
.main-wrap{
  margin-right:var(--sidebar-w);
  flex:1; min-height:100vh;
  display:flex; flex-direction:column;
  position:relative; z-index:1;
}

/* ─── TOPBAR ─── */
.topbar{
  height:52px;
  background:rgba(4,4,14,.78);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky; top:0; z-index:50;
}
.light .topbar{ background:rgba(240,240,252,.85); }

.page-title{ font-size:13px; font-weight:600; color:var(--text-soft); letter-spacing:.2px; }
.topbar-actions{ display:flex; gap:8px; }

.content{ padding:24px 28px; flex:1; }

/* ─── CARD ─── */
.card{
  background:var(--card);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid var(--border);
  border-radius:14px;
  padding:22px 24px;
  margin-bottom:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
}

/* ─── BUTTONS ─── */
.btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 16px;
  border-radius:8px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.05);
  color:var(--text-soft);
  text-decoration:none;
  font-size:13px;
  font-family:'Vazirmatn',sans-serif;
  font-weight:500;
  cursor:pointer;
  transition:all var(--transition);
  white-space:nowrap;
}
.btn:hover{
  border-color:var(--primary-border);
  color:var(--primary-light);
  background:var(--primary-glow);
  box-shadow:0 0 14px rgba(99,102,241,.15);
}

.btn-primary{
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  border-color:transparent; color:#fff;
  box-shadow:0 0 22px rgba(99,102,241,.38), 0 2px 8px rgba(0,0,0,.35);
}
.btn-primary:hover{
  opacity:.9; color:#fff;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  box-shadow:0 0 32px rgba(99,102,241,.52), 0 4px 14px rgba(0,0,0,.35);
  transform:translateY(-1px);
}

.btn-danger{ border-color:rgba(244,63,94,.22); color:var(--danger); }
.btn-danger:hover{
  background:rgba(244,63,94,.09);
  border-color:rgba(244,63,94,.42);
  box-shadow:0 0 14px rgba(244,63,94,.14);
}

.btn-sm{ padding:5px 12px; font-size:12px; }

/* ─── DIVIDER ─── */
.divider{ border:none; border-top:1px solid var(--border); margin:16px 0; }

/* ─── INPUT FOCUS ─── */
input:focus, textarea:focus, select:focus{
  outline:none;
  border-color:var(--primary-border) !important;
  box-shadow:0 0 0 3px rgba(99,102,241,.11) !important;
}

/* ─── CHIP ─── */
.chip{
  font-size:11px;
  background:rgba(99,102,241,.12);
  color:var(--primary-light);
  border:1px solid var(--primary-border);
  padding:2px 9px; border-radius:20px;
}
.light .chip{ color:var(--primary); }

/* ─── PAGE FADE IN ─── */
@keyframes pageFadeIn{
  from{ opacity:0; transform:translateY(5px); }
  to{ opacity:1; transform:translateY(0); }
}
.content{ animation:pageFadeIn .2s ease both; }

{% block extra_css %}{% endblock %}

</style>
</head>
<body>

<!-- Ambient glow orbs -->
<div class="ambient ambient-1"></div>
<div class="ambient ambient-2"></div>
<div class="ambient ambient-3"></div>

<aside class="sidebar">
  <div class="logo">
    <div class="logo-icon">⬡</div>
    <div class="logo-name">FamilyGraph</div>
    <div class="logo-desc">نقشه روابط شخصی</div>
  </div>

  <nav class="nav">
    <div class="nav-section">فضای کاری</div>
    <a href="/"              class="nav-item {% block nav_home  %}{% endblock %}"><span class="nav-icon">◈</span> گراف</a>
    <a href="/nodes/"        class="nav-item {% block nav_nodes %}{% endblock %}"><span class="nav-icon">◉</span> نودها</a>
    <a href="/relationships/"class="nav-item {% block nav_rels  %}{% endblock %}"><span class="nav-icon">⟶</span> روابط</a>
    <a href="/informations/" class="nav-item {% block nav_info  %}{% endblock %}"><span class="nav-icon">≡</span> اطلاعات</a>
    <a href="/events/"       class="nav-item {% block nav_events %}{% endblock %}"><span class="nav-icon">◷</span> رویدادها</a>

    <div class="nav-section">تحلیل</div>
    <a href="/communities/"  class="nav-item {% block nav_communities %}{% endblock %}"><span class="nav-icon">⬡</span> گروه‌ها</a>
    <a href="/insights/"     class="nav-item {% block nav_insights %}{% endblock %}"><span class="nav-icon">◎</span> بینش‌ها</a>
    <a href="/chat/"         class="nav-item {% block nav_chat  %}{% endblock %}"><span class="nav-icon">✦</span> چت AI</a>
  </nav>

  <div class="sidebar-bottom">
    <button class="theme-btn" onclick="toggleTheme()">
      <span id="themeIcon">☀</span>
      <span id="themeLabel">تم روشن</span>
    </button>
  </div>
</aside>

<div class="main-wrap">
  <div class="topbar">
    <span class="page-title">{% block page_title %}{% endblock %}</span>
    <div class="topbar-actions">{% block topbar_actions %}{% endblock %}</div>
  </div>
  <div class="content">{% block content %}{% endblock %}</div>
</div>

<script>
function toggleTheme(){
  const on = document.body.classList.toggle("light")
  localStorage.setItem("theme", on?"light":"dark")
  document.getElementById("themeIcon").textContent  = on ? "☾" : "☀"
  document.getElementById("themeLabel").textContent = on ? "تم تاریک" : "تم روشن"
}
if(localStorage.getItem("theme")==="light"){
  document.body.classList.add("light")
  document.getElementById("themeIcon").textContent  = "☾"
  document.getElementById("themeLabel").textContent = "تم تاریک"
}
</script>
</body>
</html>
