<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رمز جدید · FamilyGraph</title><style>body{margin:0;background:#070712;color:#e8eaf6;font-family:Arial,sans-serif}.box{max-width:430px;margin:10vh auto;padding:28px;background:#121326;border:1px solid #303153;border-radius:18px}p,ul{color:#a7a8c2;line-height:1.9;font-size:13px}input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0 14px;border-radius:9px;border:1px solid #3b3c62;background:#0b0b19;color:#fff}button{padding:11px 18px;border:0;border-radius:9px;background:#6366f1;color:white;cursor:pointer}</style></head><body><main class="box"><h1>رمز جدید</h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">ذخیرهٔ رمز</button></form>{% else %}<p>این لینک نامعتبر یا منقضی شده است. دوباره درخواست لینک بده.</p><a href="/password-reset/">درخواست دوباره</a>{% endif %}</main></body></html>
