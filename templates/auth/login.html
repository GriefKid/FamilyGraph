<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود — FamilyGraph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700;800;900&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{ box-sizing:border-box; margin:0; padding:0; }

:root{
  --bg: #04040e;
  --card: rgba(255,255,255,.042);
  --border: rgba(255,255,255,.08);
  --text: #e8eaf6;
  --text-soft: #7878a0;
  --text-muted: #3e3e60;
  --primary: #6366f1;
  --primary-light: #a5b4fc;
  --primary-glow: rgba(99,102,241,.22);
  --secondary: #8b5cf6;
  --danger: #f43f5e;
  --success: #10b981;
}

html, body{
  min-height: 100vh;
  font-family: 'Estedad', 'Vazirmatn', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

/* ── Animated Background ── */
.bg{
  position: fixed; inset: 0;
  background: radial-gradient(ellipse 80% 60% at 60% -10%, rgba(99,102,241,.18) 0%, transparent 60%),
              radial-gradient(ellipse 60% 60% at 10% 80%, rgba(139,92,246,.12) 0%, transparent 55%),
              radial-gradient(ellipse 50% 40% at 85% 75%, rgba(59,130,246,.08) 0%, transparent 50%),
              var(--bg);
  z-index: 0;
}

/* Floating orbs */
.orb{
  position: fixed; border-radius: 50%;
  filter: blur(70px); pointer-events: none;
  animation: orbFloat 12s ease-in-out infinite;
}
.orb-1{
  width: 500px; height: 500px; top: -150px; right: -100px;
  background: radial-gradient(circle, rgba(99,102,241,.25) 0%, transparent 65%);
  animation-delay: 0s;
}
.orb-2{
  width: 420px; height: 420px; bottom: -120px; left: -80px;
  background: radial-gradient(circle, rgba(139,92,246,.2) 0%, transparent 60%);
  animation-delay: -4s;
}
.orb-3{
  width: 280px; height: 280px; top: 40%; right: 30%;
  background: radial-gradient(circle, rgba(59,130,246,.12) 0%, transparent 60%);
  animation-delay: -8s;
}
@keyframes orbFloat{
  0%, 100%{ transform: translate(0, 0) scale(1); }
  30%{ transform: translate(25px, -40px) scale(1.08); }
  60%{ transform: translate(-15px, 30px) scale(0.94); }
}

/* Subtle grid */
.bg::after{
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(99,102,241,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(99,102,241,.04) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
}

/* ── Layout ── */
.page{
  position: relative; z-index: 10;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

/* ── Card ── */
.card{
  width: 100%; max-width: 440px;
  background: rgba(8,8,22,.72);
  backdrop-filter: blur(24px) saturate(140%);
  -webkit-backdrop-filter: blur(24px) saturate(140%);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 28px;
  padding: 44px 40px 36px;
  box-shadow:
    0 30px 80px rgba(0,0,0,.6),
    0 0 0 1px rgba(99,102,241,.1),
    inset 0 1px 0 rgba(255,255,255,.07);
  animation: cardIn .45s cubic-bezier(.22,.9,.36,1) both;
  position: relative;
  overflow: hidden;
}
@keyframes cardIn{
  from{ opacity:0; transform:translateY(28px) scale(.97); }
  to  { opacity:1; transform:translateY(0) scale(1); }
}

/* Top shimmer line */
.card::before{
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(99,102,241,.6), rgba(139,92,246,.5), transparent);
}

/* ── Logo / Header ── */
.logo-wrap{
  text-align: center;
  margin-bottom: 32px;
}
.logo-icon{
  display: inline-flex; align-items: center; justify-content: center;
  width: 60px; height: 60px; border-radius: 18px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  font-size: 28px;
  box-shadow: 0 0 40px rgba(99,102,241,.55), 0 8px 24px rgba(0,0,0,.5);
  margin-bottom: 16px;
  animation: iconPulse 3s ease-in-out infinite;
}
@keyframes iconPulse{
  0%,100%{ box-shadow: 0 0 40px rgba(99,102,241,.55), 0 8px 24px rgba(0,0,0,.5); }
  50%    { box-shadow: 0 0 56px rgba(99,102,241,.75), 0 8px 24px rgba(0,0,0,.5); }
}
.logo-name{
  font-size: 22px; font-weight: 800; letter-spacing: -.5px;
  background: linear-gradient(135deg, #e8eaf6 20%, #a5b4fc);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.logo-sub{
  font-size: 13px; color: var(--text-soft); margin-top: 5px;
}

/* ── Error ── */
.error-box{
  background: rgba(244,63,94,.1);
  border: 1px solid rgba(244,63,94,.25);
  border-radius: 12px;
  padding: 11px 15px;
  font-size: 13px;
  color: #fb7185;
  margin-bottom: 20px;
  display: flex; gap: 8px; align-items: flex-start;
  animation: shake .35s ease;
}
@keyframes shake{
  0%,100%{ transform: translateX(0); }
  20%{ transform: translateX(-6px); }
  40%{ transform: translateX(6px); }
  60%{ transform: translateX(-4px); }
  80%{ transform: translateX(4px); }
}

/* ── Fields ── */
.field{
  margin-bottom: 18px;
  position: relative;
}
.field label{
  display: block;
  font-size: 12px; font-weight: 600;
  color: var(--text-soft);
  margin-bottom: 7px;
  letter-spacing: .3px;
}
.field-inner{
  position: relative; display: flex; align-items: center;
}
.field-icon{
  position: absolute; right: 14px;
  font-size: 15px; opacity: .45;
  pointer-events: none;
  transition: opacity .2s;
}
.field input{
  width: 100%;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 12px;
  padding: 12px 44px 12px 16px;
  color: var(--text);
  font-family: 'Vazirmatn', sans-serif;
  font-size: 14px;
  transition: all .2s;
}
.field input:focus{
  outline: none;
  border-color: rgba(99,102,241,.55);
  background: rgba(99,102,241,.06);
  box-shadow: 0 0 0 3px rgba(99,102,241,.12);
}
.field input:focus + .field-icon{ opacity: .8; }
.field input::placeholder{ color: var(--text-muted); }

/* Password toggle */
.pw-toggle{
  position: absolute; left: 14px;
  background: none; border: none;
  color: var(--text-muted); cursor: pointer;
  font-size: 16px; padding: 0;
  transition: color .15s;
}
.pw-toggle:hover{ color: var(--primary-light); }

/* ── CAPTCHA ── */
.captcha-wrap{
  background: rgba(99,102,241,.06);
  border: 1px solid rgba(99,102,241,.15);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 22px;
}
.captcha-label{
  font-size: 11px; font-weight: 600; color: var(--text-soft);
  margin-bottom: 10px; letter-spacing: .3px;
}
.captcha-row{
  display: flex; align-items: center; gap: 10px;
}
.captcha-question{
  background: rgba(0,0,0,.25);
  border: 1px solid rgba(99,102,241,.2);
  border-radius: 10px;
  padding: 9px 14px;
  font-size: 18px; font-weight: 700;
  color: var(--primary-light);
  white-space: nowrap; flex-shrink: 0;
  letter-spacing: 1px;
}
.captcha-eq{ font-size: 18px; font-weight: 700; color: var(--text-soft); flex-shrink: 0; }
.captcha-input{
  flex: 1;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 10px;
  padding: 10px 12px;
  color: var(--text);
  font-family: 'Vazirmatn', sans-serif;
  font-size: 16px; font-weight: 700;
  text-align: center;
  transition: all .2s;
}
.captcha-input:focus{
  outline: none;
  border-color: rgba(99,102,241,.5);
  box-shadow: 0 0 0 3px rgba(99,102,241,.1);
}
.captcha-refresh{
  background: none; border: none;
  color: var(--text-muted); cursor: pointer;
  font-size: 16px; flex-shrink: 0;
  transition: all .2s; padding: 6px;
  border-radius: 8px;
}
.captcha-refresh:hover{
  color: var(--primary-light);
  background: rgba(99,102,241,.1);
  transform: rotate(180deg);
}

/* ── Remember me ── */
.remember-row{
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 22px;
}
.remember-row input[type=checkbox]{
  width: 16px; height: 16px;
  accent-color: var(--primary);
  cursor: pointer;
}
.remember-row label{
  font-size: 13px; color: var(--text-soft); cursor: pointer;
}

/* ── Submit Button ── */
.btn-login{
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  border: none; border-radius: 14px;
  color: #fff;
  font-family: 'Vazirmatn', sans-serif;
  font-size: 15px; font-weight: 700;
  cursor: pointer;
  transition: all .22s;
  box-shadow: 0 0 30px rgba(99,102,241,.45), 0 4px 14px rgba(0,0,0,.35);
  position: relative; overflow: hidden;
}
.btn-login::after{
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.12), transparent);
  opacity: 0; transition: opacity .2s;
}
.btn-login:hover{
  transform: translateY(-2px);
  box-shadow: 0 0 44px rgba(99,102,241,.62), 0 8px 22px rgba(0,0,0,.38);
}
.btn-login:hover::after{ opacity: 1; }
.btn-login:active{ transform: translateY(0); }
.btn-login:disabled{
  opacity: .6; cursor: wait; transform: none;
}

/* Spinner inside button */
.btn-spinner{
  display: inline-block; width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff; border-radius: 50%;
  animation: spin .6s linear infinite;
  vertical-align: middle; margin-left: 6px;
}
@keyframes spin{ to{ transform: rotate(360deg); } }

/* ── Footer ── */
.card-footer{
  margin-top: 24px;
  text-align: center;
  font-size: 13px;
  color: var(--text-soft);
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,.05);
}
.card-footer a{
  color: var(--primary-light);
  text-decoration: none;
  font-weight: 600;
  transition: color .15s;
}
.card-footer a:hover{ color: #c7d2fe; text-decoration: underline; }
</style>
</head>
<body>

<div class="bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="page">
  <div class="card">

    <!-- Logo -->
    <div class="logo-wrap">
      <div class="logo-icon">⬡</div>
      <div class="logo-name">FamilyGraph</div>
      <div class="logo-sub">نقشه روابط شخصی شما</div>
    </div>

    <!-- Error -->
    {% if error %}
    <div class="error-box">⚠ {{ error }}</div>
    {% endif %}

    <!-- Form -->
    <form method="post" id="loginForm" novalidate>
      {% csrf_token %}

      <div class="field">
        <label for="username">نام کاربری یا ایمیل</label>
        <div class="field-inner">
          <input
            type="text" name="username" id="username"
            autocomplete="username" placeholder="username"
            value="{{ request.POST.username|default:'' }}"
            required autofocus
          >
          <span class="field-icon">👤</span>
        </div>
      </div>

      <div class="field">
        <label for="password">رمز عبور</label>
        <div class="field-inner">
          <input
            type="password" name="password" id="password"
            autocomplete="current-password" placeholder="••••••••"
            required
          >
          <span class="field-icon">🔒</span>
          <button type="button" class="pw-toggle" onclick="togglePw()" id="pwEye" title="نمایش/پنهان">👁</button>
        </div>
      </div>

      <!-- CAPTCHA -->
      <div class="captcha-wrap">
        <div class="captcha-label">تأیید انسان‌بودن</div>
        <div class="captcha-row">
          <div class="captcha-question" id="captchaQ">{{ captcha_q }}</div>
          <span class="captcha-eq">= ?</span>
          <input
            type="number" name="captcha" id="captchaAns"
            class="captcha-input" placeholder="؟"
            inputmode="numeric" min="0" max="99" required
          >
          <button type="button" class="captcha-refresh" id="refreshBtn" title="سوال جدید" onclick="refreshCaptcha()">↻</button>
        </div>
      </div>

      <!-- Remember me -->
      <div class="remember-row">
        <input type="checkbox" name="remember_me" id="remember_me" value="1">
        <label for="remember_me">مرا به خاطر بسپار (۳۰ روز)</label>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        ورود به حساب
      </button>
    </form>

    <div class="card-footer">
      <a href="/password-reset/">رمز عبورم را فراموش کردم</a><br>
      حساب ندارید؟ <a href="/register/">ثبت‌نام رایگان</a>
    </div>
  </div>
</div>

<script>
// Password toggle
function togglePw(){
  const inp = document.getElementById('password');
  const eye = document.getElementById('pwEye');
  if(inp.type === 'password'){
    inp.type = 'text'; eye.textContent = '🙈';
  } else {
    inp.type = 'password'; eye.textContent = '👁';
  }
}

// Refresh captcha via AJAX
async function refreshCaptcha(){
  const btn = document.getElementById('refreshBtn');
  btn.style.pointerEvents = 'none';
  btn.style.opacity = '.5';
  try{
    const r = await fetch('/api/captcha/');
    const d = await r.json();
    document.getElementById('captchaQ').textContent = d.question;
    document.getElementById('captchaAns').value = '';
    document.getElementById('captchaAns').focus();
  } catch(e){}
  btn.style.pointerEvents = '';
  btn.style.opacity = '';
}

// Submit loading state
document.getElementById('loginForm').addEventListener('submit', function(){
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="btn-spinner"></span> در حال ورود...';
});

// Auto-focus first empty field
(function(){
  const u = document.getElementById('username');
  const p = document.getElementById('password');
  if(!u.value){ u.focus(); }
  else if(!p.value){ p.focus(); }
})();
</script>
</body>
</html>
